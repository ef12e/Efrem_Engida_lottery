<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ጌደኦ ሎተሪ | 100 አዝራሮች</title>
<style>
:root{--bg:#050b14;--card:#091526e8;--text:#f7fbff;--muted:#b8c7d9;--cyan:#23d8ff;--green:#20d39b;--gold:#ffd34d;--line:#2a4a68}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background-image:linear-gradient(180deg,rgba(2,8,18,.75),rgba(2,8,18,.92)),url("gedeo-lottery-login-background.png");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:var(--text);
  font-family:Arial,"Noto Sans Ethiopic",sans-serif
}
header{position:sticky;top:0;z-index:20;background:rgba(7, 16, 31, 0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{max-width:1150px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
nav .brand2{font-weight:1000;color:var(--cyan);font-size:21px}
section{max-width:1150px;margin:auto;padding:45px 20px}
.title{text-align:center;font-size:31px;margin:0 0 25px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:linear-gradient(145deg,rgba(16,34,56,0.85),rgba(10,22,38,0.85));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 50px #0005;backdrop-filter:blur(8px);text-align:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;font-size:15px;cursor:pointer;margin:5px 0;width:100%}
.phone-btn{background:#2b9ed0;color:white}
.pay-btn{background:linear-gradient(90deg,var(--green),#65f2c4);color:#03130d}
footer{text-align:center;padding:30px 20px;color:#8295ab;border-top:1px solid var(--line);background:rgba(5, 11, 20, 0.85)}
</style>
</head>
<body>

<header><nav>
  <div class="brand2">🎟️ ጌደኦ ሎተሪ - 100 አዝራሮች</div>
</nav></header>

<section>
  <h2 class="title">✨ 100 አዝራሮች (Buttons) በቅደም ተከተል</h2>
  <div class="grid" id="buttonContainer">
    <!-- 100 Buttons will be generated dynamically via JavaScript -->
  </div>
</section>

<footer>© 2026 ጌደኦ ሎተሪ • ኤፍሬም እንግዳ • መብቱ በህግ የተጠበቀ ነው</footer>

<script>
const container = document.getElementById('buttonContainer');

for (let i = 1; i <= 100; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  
  card.innerHTML = `
    <h3>አዝራር (Button) #${i}</h3>
    <button class="btn phone-btn" onclick="enterPhone(${i})">1ኛ ክሊክ: ስልክ ቁጥር አስቀምጥ</button>
    <button class="btn pay-btn" onclick="makePayment(${i})">2ኛ ክሊክ: ብር ከፍል (CBE)</button>
  `;
  
  container.appendChild(card);
}

function enterPhone(index) {
  let phone = prompt(`አዝራር #${index}: እባክዎ የስልክ ቁጥርዎን ያስገቡ (ለምሳሌ፦ 09xxxxxxxx):`);
  if (phone) {
    alert(`አዝራር #${index}: ስልክ ቁጥርዎ (${phone}) በተሳካ ሁኔታ ተመዝግቧል!`);
  }
}

function makePayment(index) {
  let confirmed = confirm(`አዝራር #${index}: በ CBE Birr ወይም CBE Account ክፍያ ለመፈጸም ይፈልጋሉ?`);
  if (confirmed) {
    alert(`አዝራር #${index}: ወደ ንግድ ባንክ (CBE) የክፍያ ማቀናጃ በመሄድ ላይ ነው...`);
  }
}
</script>

</body>
</html>
