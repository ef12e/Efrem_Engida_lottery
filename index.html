<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ኤፍሬም እንግዳ ሎተሪ</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#075985;color:white;padding:22px;text-align:center}
main{max-width:700px;margin:auto;padding:18px}.card{background:white;padding:20px;margin:14px 0;border-radius:16px;box-shadow:0 3px 14px #0001}
button{background:#075985;color:white;border:0;padding:13px 18px;border-radius:10px;font-size:16px;margin:5px;cursor:pointer}
input{padding:12px;border:1px solid #ccc;border-radius:9px;width:90%;margin:7px 0}
#photo{max-width:180px;max-height:180px;border-radius:50%;display:block;margin:12px auto}
.ticket{font-size:28px;font-weight:bold;text-align:center;padding:18px;background:#e0f2fe;border-radius:12px}
nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}

</style></head>
<body>
<header><h1>🎟️ ኤፍሬም እንግዳ ሎተሪ</h1><p>የሙከራ ሎተሪ ድረ-ገጽ</p></header>
<main>
<nav>
<button onclick="show('home')">መነሻ</button><button onclick="show('ticket')">ቲኬት</button>
<button onclick="show('check')">ቼክ</button><button onclick="show('photo')">ፎቶ</button>
</nav>
<section id="home" class="card"><h2>እንኳን ደህና መጡ!</h2><p>ይህ የሎተሪ ድረ-ገጽ የሙከራ (Demo) ስሪት ነው።</p><button onclick="show('ticket')">ቲኬት ፍጠር</button></section>
<section id="ticket" class="card" style="display:none"><h2>🎟️ ቲኬት ፍጠር</h2><input id="name" placeholder="ስም"><button onclick="makeTicket()">ቲኬት ፍጠር</button><div id="ticketOut"></div></section>
<section id="check" class="card" style="display:none"><h2>🔎 ቲኬት ፈልግ</h2><input id="search" placeholder="የቲኬት ቁጥር"><button onclick="checkTicket()">ፈልግ</button><div id="checkOut"></div></section>
<section id="photo" class="card" style="display:none"><h2>📷 ፎቶ ጨምር</h2><input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event)"><img id="photo"><p class="small">ካሜራ ወይም የስልክ ፎቶ መምረጥ ትችላለህ።</p></section>
<section class="card"><h3>⚠️ ማስታወሻ</h3><p class="small">ይህ ሙከራ ነው፤ እውነተኛ ገንዘብ ክፍያ ወይም እውነተኛ ሎተሪ አይሰራም።</p></section>
</main>
<script>
let tickets=JSON.parse(localStorage.getItem('tickets')||'{}');
function show(id){['home','ticket','check','photo'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none')}
function makeTicket(){let n=document.getElementById('name').value.trim();if(!n)return alert('ስም ያስገቡ');let no=Math.floor(100000+Math.random()*900000);tickets[no]=n;localStorage.setItem('tickets',JSON.stringify(tickets));document.getElementById('ticketOut').innerHTML='<div class="ticket">#'+no+'</div><p>ባለቤት፦ '+n+'</p>'}
function checkTicket(){let no=document.getElementById('search').value.trim();document.getElementById('checkOut').innerHTML=tickets[no]?'<h3>✅ ተገኝቷል</h3><p>ባለቤት፦ '+tickets[no]+'</p>':'<h3>❌ አልተገኘም</h3>'}
function loadPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('photo').src=r.result;localStorage.setItem('photo',r.result)};r.readAsDataURL(f)}
if(localStorage.getItem('photo'))document.getElementById('photo').src=localStorage.getItem('photo');
</script>
</body></html>
